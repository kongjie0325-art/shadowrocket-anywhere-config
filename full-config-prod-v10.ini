[URL Rewrite]
(?<=_region=)CN(?=&) US 307
(?<=&mcc_mnc=)460[0-9]{2}(?=&) 310410 307
^https?://(www|s)\.youtube\.com/api/stats/ads - reject-200
^https?://(www|s)\.youtube\.com/(pagead|ptracking) - reject-200

[Script]
bilibili-ad = type=http-response,pattern=^https?://api\.bilibili\.com,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/bilibili-ad.js,requires-body=1,max-size=2097152,timeout=15
weibo-ad = type=http-response,pattern=^https?://api\.weibo\.cn,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/weibo-ad.js,requires-body=1,max-size=2097152,timeout=10
zhihu-ad = type=http-response,pattern=^https?://(www|api)\.zhihu\.com,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/zhihu-ad.js,requires-body=1,max-size=1048576,timeout=10

[MITM]
enable = false
h2 = false
hostname = api.bilibili.com,app.bilibili.com,www.zhihu.com,api.zhihu.com,api.weibo.cn,m5.amap.com,spclient.wg.spotify.com,*.tiktokv.com,web.telegram.org
