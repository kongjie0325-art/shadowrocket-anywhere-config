# anywhere-rules GeoIP_CN.arrs + Geosite_CN.arrs + CN_Accelerated.arrs
GEOIP,CN,DIRECT,no-resolve
GEOIP,PRIVATE,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/chikacya/anywhere-rules/main/rules/common/Geosite_CN.arrs,DIRECT
RULE-SET,https://raw.githubusercontent.com/chikacya/anywhere-rules/main/rules/common/CN_Accelerated.arrs,DIRECT

# FINAL
FINAL,DIRECT


[URL Rewrite]

# TikTok region
(?<=_region=)CN(?=&) US 307
(?<=&mcc_mnc=)460[0-9]{2}(?=&) 310410 307
(?<=&sys_region=)CN(?=&) US 307
(?<=&carrier_region=)CN(?=&) US 310410 307

# YouTube ads
^https?://(www|s)\.youtube\.com/api/stats/ads - reject-200
^https?://(www|s)\.youtube\.com/api/stats/qoe - reject-200
^https?://(www|s)\.youtube\.com/(pagead|ptracking) - reject-200
^https?://(www|s)\.youtube\.com/youtubei/v1/ads - reject-200


[Script]

bilibili-ad = type=http-response,pattern=^https?://api\.bilibili\.com,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/bilibili-ad.js,requires-body=1,max-size=2097152,timeout=15
weibo-ad = type=http-response,pattern=^https?://api\.weibo\.cn,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/weibo-ad.js,requires-body=1,max-size=2097152,timeout=10
zhihu-ad = type=http-response,pattern=^https?://(www|api)\.zhihu\.com,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/zhihu-ad.js,requires-body=1,max-size=1048576,timeout=10
amap-ad = type=http-response,pattern=^https?://m5\.amap\.com,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/amap-ad.js,requires-body=1,max-size=524288,timeout=10
telegram-web = type=http-response,pattern=^https?://web\.telegram\.org,script-path=https://raw.githubusercontent.com/kongjie0325-art/shadowrocket-anywhere-config/master/scripts/telegram-web.js,requires-body=1,max-size=1048576,timeout=10


[MITM]

enable = false
h2 = false

hostname = api.bilibili.com,app.bilibili.com,www.zhihu.com,api.zhihu.com,api.weibo.cn,m5.amap.com,m5-zb.amap.com,oss.amap.com,ai.amap.com,sns.amap.com,info.amap.com,spclient.wg.spotify.com,*.tiktokv.com,*.byteoversea.com,*.tik-tokapi.com,*.tiktok.com,web.telegram.org
