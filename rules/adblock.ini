RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,拦截

# 2. 本地关键词拦截
DOMAIN-KEYWORD,ads,拦截
DOMAIN-KEYWORD,adsense,拦截
DOMAIN-KEYWORD,adserver,拦截
DOMAIN-KEYWORD,doubleclick,拦截
DOMAIN-KEYWORD,analytics,拦截
DOMAIN-KEYWORD,tracker,拦截
DOMAIN-KEYWORD,telemetry,拦截
DOMAIN-KEYWORD,adnxs,拦截
DOMAIN-KEYWORD,adtech,拦截
DOMAIN-KEYWORD,adclick,拦截
DOMAIN-KEYWORD,admob,拦截
DOMAIN-KEYWORD,mopub,拦截
DOMAIN-KEYWORD,unityads,拦截
DOMAIN-KEYWORD,ironsrc,拦截
DOMAIN-KEYWORD,vungle,拦截
DOMAIN-KEYWORD,applovin,拦截
DOMAIN-KEYWORD,chartboost,拦截

# 3. 本地域名拦截
DOMAIN-SUFFIX,admob.com,拦截
DOMAIN-SUFFIX,googlesyndication.com,拦截
DOMAIN-SUFFIX,googleadservices.com,拦截
DOMAIN-SUFFIX,google-analytics.com,拦截
DOMAIN-SUFFIX,doubleclick.net,拦截
DOMAIN-SUFFIX,googletagmanager.com,拦截
DOMAIN-SUFFIX,googletagservices.com,拦截
DOMAIN-SUFFIX,amazon-adsystem.com,拦截
DOMAIN-SUFFIX,ads-twitter.com,拦截

# 4. App 专用广告接口（需 MITM）
# YouTube
URL-REGEX,^https?://(www|s)\.youtube\.com/api/stats/ads,REJECT
URL-REGEX,^https?://(www|s)\.youtube\.com/(pagead|ptracking),REJECT

# Bilibili
URL-REGEX,^https?://api\.bilibili\.com/x/v2/dm/ad,REJECT
URL-REGEX,^https?://api\.bilibili\.com/x/report/heartbeat/mobile,REJECT-DROP
URL-REGEX,^https?://api\.bilibili\.com/x/report/click/ios,REJECT-DROP

# 知乎
URL-REGEX,^https?://api\.zhihu\.com/(notifications/v\d+/count|v\d+/package|me/guides|ad|fringe|commercial|market/popovers|search/(top|tab)|.?featured-comment-ad|appview/api/v\d+/answers/\d+/recommendations),REJECT

# 微博
URL-REGEX,^https?://(ad\d\.sina\.com\.cn|boot\.biz\.weibo\.com|bootpreload\.uve\.weibo\.com|bootrealtime\.uve\.weibo\.com|brandvideo\.biz\.weibo\.com|sdkclick\.biz\.weibo\.com),REJECT

# 5. QUIC 阻断（强制 HTTP/2 以便 MITM 生效）
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT
